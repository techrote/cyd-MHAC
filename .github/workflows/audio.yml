name: Audio qualification
on:
  pull_request:
    branches: [main]
    paths:
      - 'include/mhac_*.hpp'
      - 'src/main.cpp'
      - 'tests/audio_test.cpp'
      - 'tests/patch_test.cpp'
      - 'tests/legacy_compare.cpp'
      - 'tests/reference/**'
      - 'platformio.ini'
      - '.github/workflows/audio.yml'
permissions:
  contents: read
jobs:
  host-and-target:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Host regression
        shell: bash
        run: |
          mkdir -p receipts
          git rev-parse HEAD > receipts/source-sha.txt
          g++ --version | tee receipts/compiler.txt
          echo "Compile candidate only; no flash approval or physical validation." > receipts/STATUS.txt
          test "$(git hash-object tests/reference/audio_002.hpp)" = 9b17e33ad666d3a152ade642c4e363d3a51cd0ef
          g++ -std=c++17 -O2 -ffp-contract=off -Wall -Wextra -Werror -pthread -Iinclude tests/audio_test.cpp -o /tmp/audio_test
          /tmp/audio_test | tee receipts/audio-test.txt
          g++ -std=c++17 -O2 -ffp-contract=off -Wall -Wextra -Werror -Iinclude tests/patch_test.cpp -o /tmp/patch_test
          /tmp/patch_test | tee receipts/patch-test.txt
          g++ -std=c++17 -O2 -ffp-contract=off -Wall -Wextra -Werror -Iinclude tests/legacy_compare.cpp -o /tmp/legacy_compare
          /tmp/legacy_compare | tee receipts/legacy-compare.txt
      - name: Target compile
        shell: bash
        run: |
          python3 -m venv /tmp/pio
          /tmp/pio/bin/pip install platformio==6.1.18
          /tmp/pio/bin/pio run -e cyd | tee receipts/target-build.txt
          cp .pio/build/cyd/firmware.bin receipts/firmware.bin
          (cd receipts && sha256sum firmware.bin > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: audio-qualification
          path: receipts/
          if-no-files-found: warn
