[platformio]
default_envs = cyd

[env:cyd]
platform = espressif32 @ 7.1.3
board = esp32dev
framework = arduino
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv
build_unflags = -std=gnu++11
; Match the host differential arithmetic policy; no implicit FP contraction.
build_flags = -std=gnu++17 -O2 -ffp-contract=off
monitor_speed = 115200
