name: Visual qualification
on:
  pull_request:
    branches: [audio/cyd-audio-001, main]
    paths:
      - 'include/mhac_visual.hpp'
      - 'include/mhac_scale.hpp'
      - 'tests/scale_test.cpp'
      - 'tests/extended_test.cpp'
      - 'include/mhac_ink.hpp'
      - 'tests/ink_test.cpp'
      - 'tests/legacy_compare.cpp'
      - 'platformio.ini'
      - 'src/mhac_visual_cyd.cpp'
      - 'tests/visual_test.cpp'
      - 'tests/visual_002_test.cpp'
      - 'tests/visual_003_test.cpp'
      - 'include/mhac_visual_audio.hpp'
      - 'include/mhac_audio.hpp'
      - 'src/main.cpp'
      - 'platformio.visual.ini'
      - '.github/workflows/visual.yml'
permissions:
  contents: read
jobs:
  visual-host-and-target:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Native replay and preview
        run: |
          mkdir -p receipts
          git rev-parse HEAD > receipts/source-sha.txt
          g++ -std=c++17 -O2 -ffp-contract=off -Wall -Wextra -Werror -Iinclude tests/visual_test.cpp -o /tmp/visual_test
          /tmp/visual_test receipts | tee receipts/host-replay.txt
          mkdir -p receipts/five-modes
          g++ -std=c++17 -O2 -ffp-contract=off -Wall -Wextra -Werror -Iinclude tests/visual_002_test.cpp -o /tmp/visual_002_test
          /tmp/visual_002_test receipts/five-modes | tee receipts/host-visual-002.txt
          mkdir -p receipts/six-pairs
          g++ -std=c++17 -O2 -ffp-contract=off -Wall -Wextra -Werror -Iinclude tests/visual_003_test.cpp -o /tmp/visual_003_test
          /tmp/visual_003_test receipts/six-pairs | tee receipts/host-visual-003.txt
          g++ -std=c++17 -O2 -ffp-contract=off -Wall -Wextra -Werror -Iinclude tests/ink_test.cpp -o /tmp/ink_test
          /tmp/ink_test receipts/ink-field.ppm | tee receipts/ink-test.txt
          g++ -std=c++17 -O2 -ffp-contract=off -Wall -Wextra -Werror -Iinclude tests/scale_test.cpp -o /tmp/scale_test
          /tmp/scale_test | tee receipts/scale-test.txt
          g++ -std=c++17 -O2 -ffp-contract=off -Wall -Wextra -Werror -Iinclude tests/extended_test.cpp -o /tmp/extended_test
          /tmp/extended_test | tee receipts/extended-test.txt
          test "$(git hash-object tests/reference/audio_002.hpp)" = 9b17e33ad666d3a152ade642c4e363d3a51cd0ef
          g++ -std=c++17 -O2 -ffp-contract=off -Wall -Wextra -Werror -Iinclude tests/legacy_compare.cpp -o /tmp/legacy_compare
          /tmp/legacy_compare | tee receipts/legacy-compare.txt
      - name: Target compile
        run: |
          python3 -m venv /tmp/pio
          /tmp/pio/bin/pip install platformio==6.1.18
          /tmp/pio/bin/pio run -c platformio.visual.ini -e cyd-visual
          cp .pio/build/cyd-visual/firmware.bin receipts/firmware.bin
          (cd receipts && sha256sum firmware.bin > SHA256SUMS)
          echo "Compile candidate only; no flash approval or physical validation." > receipts/STATUS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: visual-qualification
          path: receipts/
          if-no-files-found: warn
